services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes: 
      - ./infra/config/mosquitto/:/mosquitto/config/

  # Internal event bus between services (see docs/decisions/0001-kafka-event-bus.md).
  # Containers use kafka:29092, tools on the host use localhost:9092.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One Postgres container per service.

  ingest-db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest_db
    volumes:
      - ingest_db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  twin-db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin_db
    volumes:
      - twin_db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rules-db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rules
      POSTGRES_PASSWORD: rules
      POSTGRES_DB: rules_db
    volumes:
      - rules_db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rules -d rules_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity_db
    volumes:
      - identity_db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: infra/dev/api-gateway.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./src/api-gateway:/app
      - ./src/shared:/shared
    depends_on:
      ingest-service:
        condition: service_started
      rules-engine:
        condition: service_started

  ingest-service:
    build:
      context: .
      dockerfile: infra/dev/ingest-service.Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./src/ingest-service:/app
      - ./src/shared:/shared
    depends_on:
      ingest-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy

  rules-engine:
    build:
      context: .
      dockerfile: infra/dev/rules-engine.Dockerfile
    ports:
      - "8083:8080"
    environment:
      DB_HOST: rules-db
      DB_USER: rules
      DB_PASSWORD: rules
      DB_NAME: rules_db
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./src/rules-engine:/app
      - ./src/shared:/shared
    depends_on:
      rules-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  device-simulator:
    build:
      context: .
      dockerfile: infra/dev/device-simulator.Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./src/device-simulator:/app
      - ./src/shared:/shared
    depends_on:
      - ingest-service
      - mosquitto

  twin-core:
    build:
      context: .
      dockerfile: infra/dev/twin-core.Dockerfile
    ports:
      - "8084:8080"
    volumes:
      - ./src/twin-core:/app
      - ./src/shared:/shared
    environment:
      # Lets `docker compose exec twin-core go run ./cmd/migrate <cmd>`
      # run without retyping the URL; the server itself reads config.yaml.
      DB_URL: postgres://twin:twin@twin-db:5432/twin_db?sslmode=disable
    depends_on:
      twin-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka_data_dev:
  ingest_db_data_dev:
  twin_db_data_dev:
  rules_db_data_dev:
  identity_db_data_dev:
