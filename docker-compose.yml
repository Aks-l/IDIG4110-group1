services:
  database:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql

  ingest-service:
    build:
      context: .
      dockerfile: infra/dev/ingest-service.Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./src/ingest-service:/app

  device-simulator:
    build:
      context: .
      dockerfile: infra/dev/device-simulator.Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ./src/device-simulator:/app

volumes:
  postgres_data_dev:
