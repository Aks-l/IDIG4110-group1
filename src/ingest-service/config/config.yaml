server:
  port: 8080
  readTimout: 10
  writeTimout: 10
  idleTimout: 30
  maxHeaderBytes: 1048576

database:
  host: "ingest-db"
  port: 5432
  user: "ingest"
  name: "ingest_db"
  password: "ingest"
  ssl: "disable"

mqtt:
  url: "tcp://mosquitto:1883"
  clientId: "ingest-service"
  autoConnect: true
  connectRetry: true
  connectRetryInterval: 5
  keepAlive: 30
  pingTimeOut: 10
  cleanSession: false
  workerCount: 10
  workerBufferSize: 1000
  topic: "sensors/+/state"

migration:
  directory: "migrations"

kafka:
  brokers: "kafka:29092"
  # The simulator stands in for one gateway until gateways are registered.
  gatewayId: "11111111-1111-1111-1111-111111111111"
  commandsGroup: "ingest-service-commands"
  
