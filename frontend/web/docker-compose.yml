services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-mock}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-mock}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      PLACEHOLDER_API_TARGET: ${PLACEHOLDER_API_TARGET:-}
      PLACEHOLDER_BACKEND_URL: ${PLACEHOLDER_BACKEND_URL:-}
      PLACEHOLDER_BACKEND_PATHS: ${PLACEHOLDER_BACKEND_PATHS:-}
      PLACEHOLDER_BACKEND_HOME_ID: ${PLACEHOLDER_BACKEND_HOME_ID:-}
      PLACEHOLDER_BACKEND_TEMPERATURE_ENTITY: ${PLACEHOLDER_BACKEND_TEMPERATURE_ENTITY:-}
    ports:
      - "3000:3000" 
    restart: unless-stopped
